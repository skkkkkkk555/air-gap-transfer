<script>
const $=s=>document.querySelector(s),N=36;
const S={buf:null,u8:null,ogg:false,fr:null,tpl:null,name:'glyph',tags:null,vendor:null,converted:false,sourceOgg:false};
const progress=(pct,text,ind=false)=>{
  const w=$('#progressWrap'),b=$('#progressBar');
  w.classList.add('show');$('#progressText').textContent=text;$('#progressPct').textContent=ind?'':Math.round(pct)+'%';
  b.classList.toggle('indeterminate',ind);if(!ind)b.style.width=Math.max(0,Math.min(100,pct))+'%';
};
const progressDone=text=>{progress(100,text);setTimeout(()=>$('#progressWrap').classList.remove('show'),1600)};
const gi=(status,hint,input)=>{$('#giStatus').textContent=status;$('#giHint').textContent=hint;$('#giInput').textContent=input||'未選択';document.querySelectorAll('.gi-zone').forEach(x=>x.classList.toggle('scanning',status.includes('解析')||status.includes('変換')||status.includes('読み込み')))};
const updateGI=()=>{const z=document.querySelectorAll('.gi-zone');const au=$('#au');if(!S.fr||!S.F){z.forEach(x=>x.classList.remove('active'));return}const i=Math.min(S.F-1,Math.max(0,Math.floor(au.currentTime/(+$('#dt').value/1000))));for(let k=0;k<36;k++)z[k].classList.toggle('active',S.fr[i*36+k]>800);};
const say=(m,e)=>{$('#st').textContent=m;$('#st').className=e?'err':''};
const cat=a=>{let n=0;a.forEach(x=>n+=x.length);const o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const deflate=async t=>new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
const inflate=async b=>new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'))).text();

/* ---- 音源→Vorbis OGG変換（ブラウザ内完結） ---- */
function ensureOggEncoder(){
  if(typeof window.OggVorbisEncoder!=='function')throw Error('OGG変換エンジンを読み込めません');
  return window.OggVorbisEncoder;
}
async function convertBufferToOgg(audioBuffer){
  const Encoder=ensureOggEncoder();
  const channels=Math.min(2,Math.max(1,audioBuffer.numberOfChannels));
  const sampleRate=audioBuffer.sampleRate,total=audioBuffer.length;
  progress(4,'OGG(Vorbis)変換を開始…');
  await new Promise(r=>setTimeout(r,0));
  const encoder=new Encoder(sampleRate,channels,.2);
  const chunkSize=Math.max(16384,Math.floor(sampleRate*1.0));
  for(let pos=0;pos<total;pos+=chunkSize){
    const end=Math.min(total,pos+chunkSize);
    const data=[];
    for(let ch=0;ch<channels;ch++)data.push(audioBuffer.getChannelData(ch).subarray(pos,end));
    encoder.encode(data);
    progress(5+end/Math.max(1,total)*90,'OGG(Vorbis)へ変換中…');
    await new Promise(r=>setTimeout(r,0));
  }
  const blob=encoder.finish('audio/ogg');
  if(!blob||blob.size<64)throw Error('OGG変換結果が空です');
  progressDone('OGG変換完了');
  return new Uint8Array(await blob.arrayBuffer());
}
/* ---- OGG ---- */
const T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let r=i<<24;for(let j=0;j<8;j++)r=r&0x80000000?(r<<1)^0x04c11db7:r<<1;t[i]=r>>>0}return t})();
const crc=b=>{let c=0;for(let i=0;i<b.length;i++)c=((c<<8)^T[((c>>>24)^b[i])&255])>>>0;return c};
function pages(u){const p=[];let o=0;while(o+27<=u.length&&u[o]==79&&u[o+1]==103){const n=u[o+26],seg=Array.from(u.subarray(o+27,o+27+n));const e=o+27+n+seg.reduce((a,b)=>a+b,0);p.push({o,hdr:27+n,seg,end:e});o=e}return p}
function headers(u,P){const pk=[];let cur=[],k=0;for(;k<P.length;k++){const p=P[k];let o=p.o+p.hdr;for(const s of p.seg){cur.push(u.subarray(o,o+s));o+=s;if(s<255){pk.push(cat(cur));cur=[]}}if(pk.length>=3)break}return{pk,last:k}}
function parseC(p){const d=new DataView(p.buffer,p.byteOffset,p.byteLength),td=new TextDecoder();let o=7;const vl=d.getUint32(o,true);o+=4;const vendor=p.slice(o,o+vl);o+=vl;const n=d.getUint32(o,true);o+=4;const c=[];for(let i=0;i<n;i++){const l=d.getUint32(o,true);o+=4;c.push(td.decode(p.subarray(o,o+l)));o+=l}return{vendor,c}}
function buildC(v,c){const te=new TextEncoder(),u32=n=>{const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n,true);return a};const q=[new Uint8Array([3,118,111,114,98,105,115]),u32(v.length),v,u32(c.length)];c.forEach(s=>{const e=te.encode(s);q.push(u32(e.length),e)});q.push(new Uint8Array([1]));return cat(q)}
function paginate(pks,serial,seq){const lace=[];pks.forEach(p=>{for(let i=0;i<Math.floor(p.length/255);i++)lace.push(255);lace.push(p.length%255)});const data=cat(pks),out=[];let o=0,li=0,cont=0;while(li<lace.length){const seg=lace.slice(li,li+255);li+=seg.length;const len=seg.reduce((a,b)=>a+b,0),h=new Uint8Array(27+seg.length);h.set([79,103,103,83,0,cont]);h.set(serial,14);new DataView(h.buffer).setUint32(18,seq,true);h[26]=seg.length;h.set(seg,27);const pg=cat([h,data.subarray(o,o+len)]);o+=len;new DataView(pg.buffer).setUint32(22,crc(pg),true);out.push(pg);seq++;cont=seg[seg.length-1]==255?1:0}return{out,seq}}
function rewrite(u,author){const P=pages(u),{pk,last}=headers(u,P);if(pk.length<3)throw Error('OGGの構造を読めません');if(String.fromCharCode(...pk[0].subarray(1,7))!=='vorbis')throw Error('Vorbis形式のOGGのみ対応です(Opusは不可)');const{vendor,c}=parseC(pk[1]);const keep=c.filter(s=>!/^(AUTHOR|CUSTOM1)=/i.test(s));const old1=c.find(s=>/^CUSTOM1=/i.test(s));const v1=$('#c1').value.trim();keep.push('AUTHOR='+author);if(v1)keep.push('CUSTOM1='+v1);else if(old1)keep.push(old1);const serial=u.subarray(P[0].o+14,P[0].o+18);const np=paginate([buildC(vendor,keep),pk[2]],serial,1);const parts=[u.subarray(P[0].o,P[0].end),...np.out];let seq=np.seq;for(let k=last+1;k<P.length;k++){const pg=u.slice(P[k].o,P[k].end);new DataView(pg.buffer).setUint32(18,seq++,true);new DataView(pg.buffer).setUint32(22,0,true);new DataView(pg.buffer).setUint32(22,crc(pg),true);parts.push(pg)}return cat(parts)}

/* ---- 読み込み ---- */
$('#f').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 S.name=f.name.replace(/\.[^.]+$/,'');S.u8=null;S.ogg=false;S.sourceOgg=false;S.converted=false;S.fr=null;S.F=0;S.tpl=null;
 gi('読み込み中…','音源を読み込んでいます。',f.name);say('読み込み中…');progress(0,'音源を読み込み中…',true);
 try{
  const original=await f.arrayBuffer(),originalU8=new Uint8Array(original);
  const isOgg=String.fromCharCode(...originalU8.subarray(0,4))==='OggS';
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw Error('このブラウザはWeb Audio APIに対応していません');
  const ctx=new AC();
  progress(2,'音声を読み込み中…',true);
  S.buf=await ctx.decodeAudioData(original.slice(0));
  if(ctx.close)try{await ctx.close()}catch(_){}
  S.sourceOgg=isOgg;
  if(isOgg)S.u8=originalU8,S.ogg=true;
  $('#au').src=URL.createObjectURL(f);
  let msg=S.buf.duration.toFixed(1)+'秒 / '+(isOgg?'OGG(Vorbis)':'元音源');
  if(!isOgg)msg+='\\nOGG(Vorbis)変換は「OGGを書き出す」時だけ実行します';
  if(isOgg)try{
   const P=pages(S.u8),{pk}=headers(S.u8,P);const{c}=parseC(pk[1]);
   const a=c.find(s=>/^AUTHOR=/i.test(s));
   if(a){
    const txt=await inflate(Uint8Array.from(atob(a.slice(7)),ch=>ch.charCodeAt(0)));
    const rows=txt.split(/\r?\n/).filter(x=>x.trim());
    const cols=rows[0].split(',').filter(x=>x!=='').length;
    S.tpl={comma:/,\s*$/.test(rows[0]),eol:txt.includes('\\r\\n')?'\\r\\n':'\\n',tail:/\\n$/.test(txt)};
    $('#dt').value=(S.buf.duration/rows.length*1000).toFixed(3);
    msg+='\\n既存の点灯データを検出: '+rows.length+'行×'+cols+'列 → 1行='+$('#dt').value+'ミリ秒に合わせました'+(cols!==N?'\\n列数が'+N+'ではありません。3a以外の可能性があります':'');
   }
   const o1=c.find(s=>/^CUSTOM1=/i.test(s));if(o1)msg+='\\nCUSTOM1タグを検出(そのまま引き継ぎます)';
  }catch(_){}
  gi('準備完了','「点灯データを生成」を押してください。',f.name);
  $('#info').textContent=msg;$('#go').disabled=false;$('#ex').disabled=true;$('#csv').disabled=true;
  say('「点灯データを生成」を押してください');
  progressDone('音源の準備完了');
 }catch(x){
  $('#progressWrap').classList.remove('show');
  say('読み込めません: '+(x&&x.message||x),1);
  gi('エラー','音源を読み込めませんでした。',f.name)
 }
};
/* ---- 解析・演出 ---- */
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}for(let l=2;l<=n;l<<=1){const a=-2*Math.PI/l,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=l){let cr=1,ci=0;for(let k=0;k<l/2;k++){const u=i+k,v=u+l/2,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
async function gen(){
 if(!S.buf)throw Error('先に音源を選択してください');
 const dtm=+$('#dt').value;if(!Number.isFinite(dtm)||dtm<=0)throw Error('1行あたりの時間が正しくありません');
 const b=S.buf,sr=b.sampleRate,dt=dtm/1000,hop=sr*dt,F=Math.max(1,Math.floor(b.length/hop)),W=512,H=W/2;
 const x=new Float32Array(b.length),nc=b.numberOfChannels;for(let c=0;c<nc;c++){const d=b.getChannelData(c);for(let i=0;i<x.length;i++)x[i]+=d[i]/nc}
 const bin=f=>Math.max(1,Math.min(H-1,Math.round(f*W/sr))),rg=(a,c)=>[bin(a),Math.max(bin(a)+1,bin(c))];
 const eb=[...Array(12)].map((_,i)=>bin(50*Math.pow(240,i/11))),rK=[rg(40,150)],rS=[rg(180,450),rg(2000,5000)],rH=[rg(6000,14000)];
 const win=Float32Array.from({length:W},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/W)),re=new Float32Array(W),im=new Float32Array(W),p1=new Float32Array(H),p2=new Float32Array(H),lm=new Float32Array(H);
 const Bd=[...Array(11)].map(()=>new Float32Array(F)),L=new Float32Array(F),fl=[new Float32Array(F),new Float32Array(F),new Float32Array(F)];
 const fx=R=>{let s=0,n=0;for(const[a,c]of R)for(let i=a;i<c;i++){s+=Math.max(0,lm[i]-Math.max(p1[i],p2[i]));n++}return s/n};
