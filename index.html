<script>
const $=s=>document.querySelector(s),N=36;
const S={buf:null,u8:null,ogg:false,fr:null,autoFr:null,F:0,tpl:null,name:'glyph',tags:null,vendor:null,converted:false,sourceOgg:false};
const progress=(pct,text,ind=false)=>{
  const w=$('#progressWrap'),b=$('#progressBar');
  w.classList.add('show');$('#progressText').textContent=text;$('#progressPct').textContent=ind?'':Math.round(pct)+'%';
  b.classList.toggle('indeterminate',ind);if(!ind)b.style.width=Math.max(0,Math.min(100,pct))+'%';
};
const progressDone=text=>{progress(100,text);setTimeout(()=>$('#progressWrap').classList.remove('show'),1600)};

// ライト形状のみ指定HTMLの ARC / CX / CY / R を基準にする。
const GLYPH_REF={cx:180,cy:164,r:133,arc:[[163,120,20],[14,-30,11],[229,211,5]]};
const GI_GEOM={
  C:{cx:GLYPH_REF.cx,cy:GLYPH_REF.cy,r:GLYPH_REF.r,a0:163,a1:120,n:20},
  A:{cx:GLYPH_REF.cx,cy:GLYPH_REF.cy,r:GLYPH_REF.r,a0:14,a1:-30,n:11},
  B:{cx:GLYPH_REF.cx,cy:GLYPH_REF.cy,r:GLYPH_REF.r,a0:229,a1:211,n:5}
};
const GI_RING=Array.from({length:11},(_,i)=>20+i).concat(Array.from({length:5},(_,i)=>31+i),Array.from({length:20},(_,i)=>i));
const GI_RING_POS=new Uint8Array(36);GI_RING.forEach((z,p)=>GI_RING_POS[z]=p);
const PATTERN_NAMES=['ORBIT SHOCK','SPECTRUM BLOOM','FRACTAL CHASE'];
const giSvg=$('#giSvg'),giZoneLayer=$('#giZoneLayer');
const pointOnArc=(cx,cy,r,deg)=>{const q=deg*Math.PI/180;return[cx+r*Math.cos(q),cy+r*Math.sin(q)]};
const svgEl=(tag,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,String(attrs[k]));return e};
function geomPoint(g,t){
  const deg=g.a0+(g.a1-g.a0)*t,q=-deg*Math.PI/180;
  return [g.cx+g.r*Math.cos(q),g.cy+g.r*Math.sin(q)];
}
function pathSlice(g,a,b){
  const pts=[];const steps=Math.max(3,Math.ceil(Math.abs(g.a1-g.a0)*.75));
  for(let q=0;q<=steps;q++)pts.push(geomPoint(g,a+(b-a)*q/steps));
  return 'M '+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' L ');
}
function renderGIMap(){
  giZoneLayer.innerHTML='';
  const add=(k,d,label)=>{
    const g=svgEl('g',{class:'gi-zone','data-zone':k});
    const hit=svgEl('path',{class:'gi-hit',d});
    const light=svgEl('path',{class:'gi-light',d});
    const title=svgEl('title',{});title.textContent=label;
    g.append(hit,light,title);giZoneLayer.appendChild(g);
  };
  for(const [name,offset] of [['C',0],['A',20],['B',31]]){
    const g=GI_GEOM[name];
    for(let k=0;k<g.n;k++){
      const a=k/g.n,b=(k+1)/g.n;
      add(offset+k,pathSlice(g,a,b),name+(k+1));
    }
  }
}
const say=(m,e)=>{$('#st').textContent=m;$('#st').className=e?'err':''};
window.addEventListener('error',e=>{
 const m=e&&e.error&&e.error.message||e&&e.message||'不明なJavaScriptエラー';
 try{say('実行エラー: '+m,1);gi('エラー','アプリの実行中にエラーが発生しました。',S.name)}catch(_){}
});
window.addEventListener('unhandledrejection',e=>{
 const m=e&&e.reason&&e.reason.message||String(e&&e.reason||'不明なPromiseエラー');
 try{say('実行エラー: '+m,1);gi('エラー','非同期処理でエラーが発生しました。',S.name)}catch(_){}
});
const cat=a=>{let n=0;a.forEach(x=>n+=x.length);const o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const deflate=async t=>new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
const inflate=async b=>new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'))).text();

/* ---- 音源→Composer互換Ogg Opus変換（ブラウザ内完結） ---- */
let __opusModulePromise=null;
async function loadOpusEncoder(){
 if(!__opusModulePromise)__opusModulePromise=import('https://cdn.jsdelivr.net/npm/@audio/encode-opus@1.3.1/opus-encode.js');
 const mod=await __opusModulePromise;
 if(typeof mod.default!=='function')throw Error('Ogg Opusエンコーダーの初期化に失敗しました');
 return mod.default;
}
async function convertBufferToOgg(audioBuffer){
 progress(0,'Composer互換Ogg Opusへ高速変換中…',true);
 gi('OGG変換中…','WASM/libopusを準備しています。',S.name);
 say('Composer互換Ogg Opusへ変換中…');
 await new Promise(r=>setTimeout(r,0));
 let enc=null;
 try{
   const opus=await loadOpusEncoder();
   gi('OGG変換中…','WASM/libopusでComposer互換Ogg Opusを生成しています。',S.name);
   progress(5,'Ogg Opusエンコーダーを準備中…');
   await new Promise(r=>setTimeout(r,0));
   const channels=Math.min(2,Math.max(1,audioBuffer.numberOfChannels));
   const data=channels===1?audioBuffer.getChannelData(0):Array.from({length:channels},(_,ch)=>audioBuffer.getChannelData(ch));
   enc=await opus({sampleRate:audioBuffer.sampleRate,channels,bitrate:96,application:'audio',complexity:2});
   progress(15,'Ogg Opusをエンコード中…');
   await new Promise(r=>setTimeout(r,0));
   const out=cat([enc.encode(data),enc.flush()]);
   enc.free();enc=null;
   if(!(out instanceof Uint8Array)||out.length<64)throw Error('Ogg Opus変換結果が空です');
   progressDone('Ogg Opus変換完了');
   return out;
 }catch(x){
   try{if(enc)enc.free()}catch(_){}
   throw Error('Ogg Opus変換に失敗しました: '+(x&&x.message||x));
 }
}
/* ---- OGG ---- */
const T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let r=i<<24;for(let j=0;j<8;j++)r=r&0x80000000?(r<<1)^0x04c11db7:r<<1;t[i]=r>>>0}return t})();
const crc=b=>{let c=0;for(let i=0;i<b.length;i++)c=((c<<8)^T[((c>>>24)^b[i])&255])>>>0;return c};
function pages(u){const p=[];let o=0;while(o+27<=u.length&&u[o]===79&&u[o+1]===103&&u[o+2]===103&&u[o+3]===83){const n=u[o+26],seg=Array.from(u.subarray(o+27,o+27+n)),end=o+27+n+seg.reduce((x,y)=>x+y,0);if(end>u.length)break;p.push({o,hdr:27+n,seg,end});o=end}return p}
function packets(u,P){const out=[];let cur=[],start=0;for(let k=0;k<P.length;k++){const p=P[k];let o=p.o+p.hdr;for(const n of p.seg){if(cur.length===0)start=k;cur.push(u.subarray(o,o+n));o+=n;if(n<255){out.push({data:cat(cur),startPage:start,endPage:k});cur=[]}}}return out}
function parseC(p){const td=new TextDecoder(),m=td.decode(p.subarray(0,8)),opus=m==='OpusTags',vorbis=td.decode(p.subarray(0,7))==='\u0003vorbis';if(!opus&&!vorbis)throw Error('OGGコメントヘッダーが不正です');const d=new DataView(p.buffer,p.byteOffset,p.byteLength);let o=opus?8:7;const vl=d.getUint32(o,true);o+=4;if(o+vl>p.length)throw Error('OGGベンダー情報が不正です');const vendor=p.slice(o,o+vl);o+=vl;const n=d.getUint32(o,true);o+=4;const c=[];for(let i=0;i<n;i++){const l=d.getUint32(o,true);o+=4;if(o+l>p.length)throw Error('OGGコメントが不正です');c.push(td.decode(p.subarray(o,o+l)));o+=l}return{vendor,c,opus}}
function buildC(v,c){const te=new TextEncoder(),u32=n=>{const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n,true);return a};const q=[te.encode('OpusTags'),u32(v.length),v,u32(c.length)];for(const s of c){const e=te.encode(s);q.push(u32(e.length),e)}return cat(q)}
function makePacketPages(packet,serial,seq,flags,granule){
 const out=[],max=255*255;let o=0,first=true;
 while(o<packet.length||first){const end=Math.min(packet.length,o+max),chunk=packet.subarray(o,end),lace=[];for(let i=0;i<chunk.length;i+=255)lace.push(Math.min(255,chunk.length-i));if(end===packet.length&&chunk.length%255===0)lace.push(0);
  const h=new Uint8Array(27+lace.length);h.set([79,103,103,83,0,(first?flags:0)|((first?0:1))]);h.set(serial,14);const hd=new DataView(h.buffer);hd.setBigUint64(6,BigInt(first?granule:0),true);hd.setUint32(18,seq++,true);h[26]=lace.length;h.set(lace,27);const pg=cat([h,chunk]);const d=new DataView(pg.buffer,pg.byteOffset,pg.byteLength);d.setUint32(22,0,true);d.setUint32(22,crc(pg),true);out.push(pg);o=end;first=false;
 }
 return{pages:out,nextSeq:seq};
}
async function validateComposition(u){
 const P=pages(u),ps=packets(u,P);if(P.length<3||ps.length<3)throw Error('OGGページ/音声パケット数が不足しています');
 const td=new TextDecoder(),head=td.decode(ps[0].data.subarray(0,8));if(head!=='OpusHead')throw Error('音声コーデックがOpusではありません');
 if(td.decode(ps[1].data.subarray(0,8))!=='OpusTags')throw Error('OpusTagsがありません');
 const parsed=parseC(ps[1].data),map=new Map();for(const x of parsed.c){const k=x.indexOf('=');if(k>0)map.set(x.slice(0,k).toUpperCase(),x.slice(k+1))}
 for(const k of ['TITLE','ALBUM','AUTHOR','COMPOSER','CUSTOM1','CUSTOM2'])if(!map.has(k))throw Error('必須タグ不足: '+k);
 if(map.get('COMPOSER')!=='v1-Asteroids Glyph Composer')throw Error('COMPOSERが3a用ではありません');
 if(map.get('CUSTOM2')!=='36cols')throw Error('CUSTOM2が36colsではありません');
 const author=await inflate(Uint8Array.from(atob(map.get('AUTHOR').replace(/\s/g,'')),x=>x.charCodeAt(0)));
 const rows=author.split(/\r\n|\n/).filter(x=>x.length);if(!rows.length)throw Error('AUTHORデータが空です');
 for(const row of rows){const v=row.split(',').filter(x=>x!=='');if(v.length!==36)throw Error('AUTHORの列数が36ではありません');for(const x of v){const n=Number(x);if(!Number.isInteger(n)||n<0||n>4095)throw Error('AUTHOR値が0〜4095の範囲外です')}}
 const custom=await inflate(Uint8Array.from(atob(map.get('CUSTOM1').replace(/\s/g,'')),x=>x.charCodeAt(0)));if(custom!==','&&!/^(?:\d+-\d+,)*$/.test(custom))throw Error('CUSTOM1形式が不正です');
 let expectedSeq=0;for(const p of P){const q=u.slice(p.o,p.end),d=new DataView(q.buffer,q.byteOffset,q.byteLength),expected=d.getUint32(22,true);if(d.getUint32(18,true)!==expectedSeq++)throw Error('OGGページ番号が連続していません');d.setUint32(22,0,true);if(expected!==crc(q))throw Error('OGG CRC検証失敗')}
 if((new DataView(u.buffer,u.byteOffset,u.byteLength).getUint8(P[0].o+5)&2)===0)throw Error('OGG BOSフラグがありません');
 if((new DataView(u.buffer,u.byteOffset,u.byteLength).getUint8(P[P.length-1].o+5)&4)===0)throw Error('OGG EOSフラグがありません');
 return{pages:P.length,rows:rows.length,durationPackets:ps.length};
}
function rewrite(u,meta){

  const z=await deflate(csvText());
  const customRaw=$('#c1').value.trim();
  let customText=customRaw;
  if(!customText&&S.tpl&&S.tpl.custom1)customText=S.tpl.custom1;
  if(!customText)customText=',';
  const c1=await deflate(customText);
  const out=rewrite(S.u8,{title:S.name,album:'Glyph Tools v2',author:b64(z),composer:'v1-Asteroids Glyph Composer',custom1:b64(c1),custom2:'36cols'});
  await validateComposition(out);
  dl(out,S.name+'_glyph.ogg');
  gi('書き出し完了','公式Composerのライブラリから取り込んでください。',S.name);
  say('書き出しました。公式Composerのライブラリから取り込んでください');
  progressDone('OGG書き出し完了');
 }catch(e){
  say(e&&e.message||e,1);
  gi('エラー','OGG書き出しに失敗しました。',S.name);
  $('#progressWrap').classList.remove('show');
 }finally{$('#ex').disabled=false}
};
$('#csv').onclick=()=>dl(csvText(),S.name+'_glyph.csv');

/* ---- プレビュー ---- */
const cv=$('#cv'),cx=cv.getContext('2d'),CX=GLYPH_REF.cx,CY=GLYPH_REF.cy,R=GLYPH_REF.r;
const Z=[];
GLYPH_REF.arc.forEach(([a0,a1,n])=>{
  const lo=Math.min(-a0,-a1)*Math.PI/180;
  const hi=Math.max(-a0,-a1)*Math.PI/180;
  for(let k=0;k<n;k++)Z.push([lo+(hi-lo)*k/n,lo+(hi-lo)*(k+1)/n]);
});
function draw(){
 const au=$('#au'),dt=+$('#dt').value||16.666;
 const i=S.fr?Math.min(S.F-1,Math.max(0,Math.floor(au.currentTime/(dt/1000)))):-1;
 const vals=i>=0?S.fr.subarray(i*N,i*N+N):null;
 const level=vals?Math.sqrt(vals.reduce((s,v)=>s+(v/4095)*(v/4095),0)/N):0;
 const peak=vals?Math.max(...vals)/4095:0;
 cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,310,340);
 cx.fillStyle='#111';cx.beginPath();cx.roundRect(10,4,290,332,30);cx.fill();
 cx.strokeStyle='rgba(255,255,255,.10)';cx.lineWidth=1;cx.stroke();
 // Same shallow arc geometry as the interactive map.
 const groups=[{from:0,to:20,w:7},{from:20,to:31,w:7},{from:31,to:36,w:6}];
  const drawZone=(k,w)=>{
   const v=vals?vals[k]/4095:0;
   const [a,b]=Z[k];
   const intensity=v;
   cx.beginPath();cx.arc(CX,CY,R,a,b);
   cx.lineCap='round';cx.lineWidth=w*(.58+.92*intensity);
   cx.shadowColor='rgba(255,255,255,'+(.12+.68*intensity)+')';
   cx.shadowBlur=intensity>0.03?2+20*intensity:0;
   cx.strokeStyle='rgba(255,255,255,'+(.05+.95*Math.pow(intensity,.72))+')';cx.stroke();
   if(intensity>.72){
     cx.beginPath();cx.arc(CX,CY,R,a,b);
     cx.lineWidth=1.4+2.6*intensity;cx.strokeStyle='rgba(255,255,255,'+(.25+.55*intensity)+')';
     cx.shadowBlur=8+18*intensity;cx.stroke();
   }
 };
 groups.forEach(g=>{for(let k=g.from;k<g.to;k++)drawZone(k,g.w)});
 cx.shadowBlur=0;
 // No fake circular Glyph rings: the preview must show only the three physical 3a tubes.
 cx.fillStyle='rgba(255,255,255,.22)';cx.font='700 8px Doto,monospace';cx.textAlign='center';
 cx.fillText(level>.72?'HIGH ENERGY':level>.42?'ACTIVE':level>.18?'FLOW':'CALM',155,322);
 $('#cnt').textContent=i>=0?String(i).padStart(5,'0'):'';
 requestAnimationFrame(draw)
}
gi('待機中','音源を選択すると解析できます');draw();setInterval(updateGI,80);
</script></body></html>
